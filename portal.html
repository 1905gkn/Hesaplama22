<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#173c2d" />
    <meta name="application-name" content="Rafex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Rafex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <script defer src="/b2b-viewer.js?v=b2b-double-row-side-ties-367"></script>
    <script defer src="/mr-viewer.js?v=mr-system-2"></script>
    <title>Rafex Configurator</title>
    <style>
      :root {
        --g: #214f3b;
        --g2: #173c2d;
        --y: #f2c500;
        --bg: #f2f4f1;
        --line: #dfe5e0;
        --ink: #17201b;
        --muted: #68736c;
        --red: #b43a3a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px Arial,
          sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 9px;
        padding: 11px 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
      .auth {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
      }
      .auth-brand {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 8vw;
        background: var(--g);
        color: #fff;
      }
      .auth-brand .brand-logo-auth {
        display: block;
        width: min(440px, 86%);
        height: auto;
        padding: 18px;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 20px 54px #07150e35;
      }
      .auth-brand .portal-name {
        margin: 26px 0 18px;
        color: #d8e2dc;
        font-size: clamp(34px, 4.5vw, 62px);
        line-height: 1;
        letter-spacing: -0.045em;
        font-weight: 400;
      }
      .auth-brand p {
        color: #c4d0c8;
        max-width: 520px;
        line-height: 1.7;
      }
      .auth-side {
        display: grid;
        place-items: center;
        padding: 30px;
      }
      .auth-card {
        width: min(410px, 100%);
        background: #fff;
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 20px 60px #17201b16;
      }
      .auth-card h2 {
        margin: 0 0 8px;
        font-size: 25px;
      }
      .auth-card > p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 24px;
      }
      .field {
        display: block;
        margin-top: 14px;
        color: #536058;
        font-size: 11px;
        font-weight: 700;
      }
      .field input {
        width: 100%;
        margin-top: 6px;
        padding: 12px;
        border: 1px solid #d8dfda;
        border-radius: 9px;
        outline: 0;
      }
      .language-field {
        display: grid;
        gap: 6px;
        margin: 0 0 18px;
        color: #536058;
        font-size: 11px;
        font-weight: 800;
      }
      .language-field select,
      .user-language-select {
        width: 100%;
        padding: 10px 11px;
        border: 1px solid #d8dfda;
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }
      .program-language {
        display: grid;
        gap: 5px;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #ffffff1c;
        color: #c6d2ca;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .06em;
      }
      .program-language select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ffffff26;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font: 700 11px Arial, sans-serif;
      }
      .field input:focus {
        border-color: #b89b00;
        box-shadow: 0 0 0 3px #f2c50033;
      }
      .primary {
        width: 100%;
        margin-top: 20px;
        background: var(--g);
        color: #fff;
      }
      .msg {
        min-height: 18px;
        margin-top: 13px;
        color: var(--red);
        font-size: 11px;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 240px 1fr;
      }
      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 20px 14px;
        background: var(--g2);
        color: #fff;
      }
      .side-brand {
        display: flex;
        align-items: center;
        padding: 5px 6px 18px;
        border-bottom: 1px solid #ffffff22;
      }
      .side-logo {
        display: block;
        width: 184px;
        max-width: 100%;
        height: auto;
        padding: 6px 9px;
        background: #fff;
        border-radius: 9px;
      }
      .nav {
        margin-top: 18px;
      }
      .nav button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0;
        padding: 11px 12px;
        background: transparent;
        color: #bcc9c0;
        text-align: left;
      }
      .nav button.active {
        background: #ffffff14;
        color: #fff;
      }
      .nav i {
        width: 24px;
        color: var(--y);
        font-style: normal;
      }
      .userbox {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 16px;
        padding: 12px;
        background: #ffffff0d;
        border-radius: 10px;
      }
      .userbox small {
        display: block;
        color: #99aa9f;
      }
      .logout {
        width: 100%;
        margin-top: 9px;
        padding: 8px;
        background: #ffffff12;
        color: #fff;
      }
      .content {
        min-width: 0;
      }
      .top {
        height: 72px;
        padding: 0 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .top h1 {
        font-size: 20px;
        margin: 0;
      }
      .top-actions {
        display: flex;
        gap: 8px;
      }
      .soft {
        background: #edf2ee;
        color: var(--g);
      }
      .page {
        padding: 26px 30px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding: 28px;
        background: var(--g);
        color: #fff;
        border-radius: 16px;
      }
      .hero p {
        margin: 0 0 9px;
        color: var(--y);
        font-size: 10px;
        letter-spacing: 0.18em;
        font-weight: 800;
      }
      .hero h2 {
        margin: 0;
        font-size: 32px;
      }
      .capacity {
        padding: 13px 18px;
        border-left: 3px solid var(--y);
        background: #0002;
      }
      .capacity small {
        display: block;
        color: #b8c8be;
      }
      .capacity b {
        font-size: 28px;
      }
      .calc-grid {
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        gap: 18px;
        margin-top: 18px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
      }
      .card-title {
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }
      .card-title h3 {
        margin: 0;
      }
      .card-title span {
        color: var(--muted);
        font-size: 10px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .input-field {
        display: block;
        margin-top: 15px;
        color: #536058;
        font-size: 10px;
        font-weight: 700;
      }
      .input-field input {
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        border: 1px solid #e5d991;
        background: #fff8d5;
        border-radius: 8px;
        font-weight: 800;
      }
      .sub {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 23px 0 9px;
      }
      .sub h4 {
        margin: 0;
      }
      .sub span {
        color: var(--muted);
        font-size: 10px;
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .dynrow {
        display: grid;
        grid-template-columns: 28px 1fr 1fr 30px;
        gap: 7px;
        align-items: end;
        padding: 9px;
        background: #f5f7f5;
        border-radius: 9px;
      }
      .dynrow > b {
        align-self: center;
        color: #9aa39d;
      }
      .dynrow .input-field {
        margin: 0;
      }
      .dynrow .input-field input {
        margin-top: 4px;
        padding: 7px;
      }
      .x {
        height: 31px;
        padding: 0;
        background: #e6eae7;
      }
      .add {
        width: 100%;
        margin-top: 8px;
        background: #edf2ee;
        color: var(--g);
        border: 1px dashed #b9c8bd;
      }
      .calc {
        width: 100%;
        margin-top: 20px;
        background: var(--y);
        color: var(--ink);
        padding: 14px;
      }
      .empty {
        min-height: 400px;
        display: grid;
        place-items: center;
        text-align: center;
        color: #849087;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin: 16px 0;
        background: var(--g);
        color: #fff;
        border-radius: 9px;
        overflow: hidden;
      }
      .summary div {
        padding: 13px;
      }
      .summary small {
        display: block;
        color: #b8c8be;
        font-size: 8px;
      }
      .summary b {
        font-size: 21px;
      }
      .table {
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .trow {
        display: grid;
        grid-template-columns: 1fr 90px;
        padding: 9px 12px;
        border-top: 1px solid #edf0ed;
      }
      .trow:first-child {
        border: 0;
        background: #eef1ee;
        font-size: 9px;
        font-weight: 800;
      }
      .trow b {
        text-align: right;
      }
      .foot-note {
        margin: 15px 0 0;
        padding: 12px;
        background: #fff8d5;
        border-left: 3px solid var(--y);
        color: #625600;
        font-size: 11px;
        line-height: 1.5;
      }
      .foot-system {
        margin-top: 13px;
        border: 1px solid var(--line);
        border-radius: 11px;
        overflow: hidden;
      }
      .foot-system-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        background: var(--g);
        color: #fff;
      }
      .foot-system-head small {
        color: #bfd0c5;
      }
      .foot-option {
        display: grid;
        grid-template-columns: 78px 1fr 86px 90px;
        gap: 8px;
        align-items: center;
        padding: 11px 12px;
        border-top: 1px solid var(--line);
      }
      .foot-option:first-of-type {
        border-top: 0;
      }
      .foot-option.recommended {
        background: #fff8d5;
      }
      .foot-option > span:first-child {
        font-weight: 800;
      }
      .foot-option small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        margin-top: 3px;
      }
      .foot-option b {
        text-align: right;
      }
      .foot-option .ok {
        color: #2f6942;
      }
      .foot-option .fail {
        color: var(--red);
      }
      .soon {
        min-height: 65vh;
        display: grid;
        place-items: center;
      }
      .soon-card {
        text-align: center;
        max-width: 520px;
        padding: 50px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .soon-card .num {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        margin: auto;
        background: var(--y);
        border-radius: 15px;
        font-size: 24px;
        font-weight: 900;
      }
      .soon-card h2 {
        font-size: 28px;
      }
      .admin-grid {
        display: grid;
        grid-template-columns: 330px 1fr;
        gap: 18px;
      }
      .users {
        width: 100%;
        border-collapse: collapse;
      }
      .users th,
      .users td {
        padding: 11px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .badge {
        padding: 4px 7px;
        border-radius: 20px;
        background: #e7f2e9;
        color: #2f6942;
        font-size: 9px;
      }
      .badge.off {
        background: #f5e7e7;
        color: #a23838;
      }
      .small-btn {
        padding: 7px 9px;
        background: #edf2ee;
        color: var(--g);
        font-size: 10px;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: #10211999;
        padding: 4vh 4vw;
      }
      .modal.open {
        display: grid;
        place-items: center;
      }
      .modal-card {
        width: min(900px, 100%);
        max-height: 92vh;
        overflow: auto;
        background: #fff;
        border-radius: 16px;
      }
      .modal-head {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 17px 20px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .modal-head h2 {
        margin: 0;
      }
      .history-list {
        padding: 15px;
      }
      .history-filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 14px 15px 0;
      }
      .history-filters[hidden] { display: none; }
      .history-filters label { color: var(--muted); font-size: 9px; font-weight: 900; text-transform: uppercase; }
      .history-filters select { width: 100%; min-height: 40px; margin-top: 5px; padding: 8px 32px 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #f8faf8; color: var(--ink); font-weight: 800; }
      .history-item {
        margin-bottom: 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .history-summary {
        width: 100%;
        display: grid;
        grid-template-columns: 80px 1fr 130px 100px;
        gap: 12px;
        align-items: center;
        padding: 13px;
        background: #f8faf8;
        text-align: left;
      }
      .history-summary small {
        display: block;
        color: var(--muted);
      }
      .history-detail {
        display: none;
        padding: 14px;
        background: #fff;
        border-top: 1px solid var(--line);
      }
      .history-item.open .history-detail {
        display: block;
      }
      .history-inputs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .history-inputs div {
        padding: 10px;
        background: #f4f6f4;
        border-radius: 8px;
      }
      .history-inputs small {
        display: block;
        color: var(--muted);
        font-size: 8px;
      }
      .history-inputs b {
        display: block;
        margin-top: 4px;
      }
      .history-groups {
        margin: 8px 0 13px;
        color: var(--muted);
        font-size: 10px;
      }
      @media (max-width: 720px) {
        .history-summary {
          grid-template-columns: 60px 1fr 80px;
        }
        .history-summary .history-user {
          display: none;
        }
        .history-inputs {
          grid-template-columns: 1fr 1fr;
        }
        .history-filters { grid-template-columns: 1fr; }
        .foot-option {
          grid-template-columns: 65px 1fr 75px;
        }
        .foot-option > b:last-child {
          display: none;
        }
      }
      @media (max-width: 1000px) {
        .calc-grid,
        .admin-grid {
          grid-template-columns: 1fr;
        }
        .auth {
          grid-template-columns: 1fr;
        }
        .auth-brand {
          display: none;
        }
      }
      @media (max-width: 720px) {
        .shell {
          grid-template-columns: 1fr;
        }
        .side {
          position: static;
          height: auto;
        }
        .nav {
          display: flex;
          overflow: auto;
        }
        .nav button {
          min-width: 140px;
        }
        .userbox {
          position: static;
          margin-top: 10px;
        }
        .top {
          padding: 0 15px;
        }
        .page {
          padding: 14px;
        }
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }
        .hero {
          display: block;
        }
        .capacity {
          margin-top: 18px;
        }
      }
    </style>
    <style>
      .foot-diagram {
        margin: 18px 0 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #f8faf8;
        text-align: center;
      }
      .foot-diagram img {
        display: block;
        width: 100%;
        height: auto;
        max-width: 1028px;
        margin: 0 auto;
        background: #fff;
        border-radius: 7px;
      }
      .foot-diagram figcaption {
        margin-top: 10px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .extra-diagonal {
        background: #eef5f0;
        border-top: 2px solid #cbdacf;
      }
      .extra-diagonal > span:first-child {
        color: var(--g);
      }
      .welcome-hero {
        padding: 32px;
        background: linear-gradient(135deg, var(--g), var(--g2));
        color: #fff;
        border-radius: 16px;
      }
      .welcome-hero p {
        margin: 0 0 10px;
        color: var(--y);
        font-size: 10px;
        letter-spacing: 0.18em;
        font-weight: 800;
      }
      .welcome-hero h2 {
        margin: 0;
        font-size: clamp(30px, 4vw, 48px);
      }
      .welcome-date {
        margin-top: 12px;
        color: #c4d0c8;
        text-transform: capitalize;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1.25fr repeat(3, 1fr);
        gap: 14px;
        margin-top: 18px;
      }
      .dashboard-card {
        min-height: 180px;
        padding: 20px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .dashboard-card small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.12em;
        font-weight: 800;
      }
      .dashboard-card .metric {
        display: block;
        margin-top: 18px;
        font-size: 30px;
      }
      .dashboard-card p {
        color: var(--muted);
        line-height: 1.5;
      }
      .weather-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .weather-icon {
        font-size: 38px;
      }
      .dashboard-meta {
        margin-top: 12px;
        color: var(--muted);
        font-size: 10px;
      }
      .dashboard-error {
        color: var(--red);
      }
      .admin-grid .card {
        overflow: auto;
      }
      @media (max-width: 1100px) {
        .dashboard-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .m2-layout {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr);
        align-items: stretch;
        gap: 18px;
        margin-top: 18px;
      }
      /* B2B, Mekik arayüz ve yerleşim altyapısını kullanır; kayıtları ve
         koyu kırmızı görsel kimliği kendi modülünde tutulur. */
      #page.b2b-mode {
        --g: #761b2a;
        --g2: #430c15;
        --red: #9f2438;
        --b2b-foot-color: #004f7c;
        --b2b-traverse-color: #e5be01;
        --b2b-foot-filter: sepia(1) saturate(8) hue-rotate(164deg) brightness(.63);
      }
      #page.b2b-mode .hero {
        background: linear-gradient(135deg, #761b2a, #430c15);
      }
      #page.b2b-mode .m2-layout { grid-template-columns:360px minmax(0,1fr); align-items:start; }
      #page.b2b-mode .m2-config-card { display:none; }
      #page.b2b-mode .m2-segment button.active,
      #page.b2b-mode .m2-form .classic-choice,
      #page.b2b-mode .m2-project-save,
      #page.b2b-mode .m2-floor-add,
      #page.b2b-mode .m2-pdf-button {
        border-color: #5b111d;
        background: linear-gradient(180deg, #8d2638, #681421);
      }
      #page.b2b-mode .m2-floor-editor,
      #page.b2b-mode .m2-report-panel,
      #page.b2b-mode .m2-saved-types-panel {
        box-shadow: 0 10px 30px #430c1518;
      }
      #page.b2b-mode .m2-floor-toolbar,
      #page.b2b-mode .m2-saved-types-head {
        border-color: #d7b8be;
      }
      #page.b2b-mode .m2-a4-brand-copy b,
      #page.b2b-mode .m2-report-head b,
      #page.b2b-mode .m2-floor-status strong {
        color: #761b2a;
      }

#173c2d;font-size:8px}.mr-accessory-widths button.active{background:#f2c500;border-color:#d8b100}.mr-accessory-levels button.active{background:#214f3b;border-color:#214f3b;color:#fff}.mr-accessory-note{margin-top:7px;padding:7px;border-radius:7px;background:#eef4ef;color:#526158;font-size:8px;line-height:1.4}.mr-accessory-empty{padding:9px;border:1px dashed #ccd7cf;border-radius:8px;color:#7a867f;text-align:center;font-size:8px}@media(max-width:520px){.mr-distance-panel,.mr-dimension-checks{grid-template-columns:1fr}}</style>

  <body>
    <section id="auth" class="auth">
      <div class="auth-brand">
        <img
          class="brand-logo-auth"
          src="/rafex-logo.png"
          alt="Rafex Raf Sistemleri"
        />
        <h1 class="portal-name">Hesaplama Portalı</h1>
        <p>
          Raf sistemleri için merkezi hesaplama, proje kaydı ve kullanıcı
          yönetim platformu.
        </p>
      </div>
      <div class="auth-side">
        <form id="loginForm" class="auth-card">
          <label class="language-field"><span data-language-label>Program Dili</span><select id="authLanguage" onchange="changeProgramLanguage(this.value,false)"><option value="tr">Türkçe</option><option value="en">English</option><option value="fr">Français</option></select></label>
          <h2 id="authTitle">Giriş Yap</h2>
          <p id="authText">
            Size tanımlanan kullanıcı adı ve şifreyle devam edin.
          </p>
          <label class="field hidden" id="setupFullNameField"
            >Ad Soyad<input id="loginFullName" autocomplete="name" /></label
          ><label class="field"
            >Kullanıcı adı<input
              id="loginUser"
              autocomplete="username"
              required /></label
          ><label class="field"
            >Şifre<input
              id="loginPass"
              type="password"
              autocomplete="current-password"
              minlength="8"
              required /></label
          ><button class="primary" id="authButton">Giriş Yap</button>
          <div class="msg" id="authMsg"></div>
        </form>
      </div>
    </section>
    <section id="app" class="shell hidden">
      <aside class="side">
        <div class="side-brand">
          <img
            class="side-logo"
            src="/rafex-logo.png"
            alt="Rafex Raf Sistemleri"
          />
        </div>
        <nav class="nav" id="nav">
          <button data-page="home" class="active"><i>00</i>Ana Sayfa</button
          ><button data-page="b2b"><i>01</i>B2B</button
          ><button data-page="ayak"><i>02</i>Ayak Hesaplama</button
          ><button data-page="travers"><i>03</i>Travers Hesaplama</button
          ><button data-page="mr"><i>04</i>MR</button
          ><button data-page="drive"><i>05</i>Drive-In</button
          ><button data-page="mekik2"><i>06</i>Mekik</button
          ><button data-page="konsol"><i>07</i>Konsol Kollu</button
          ><button id="adminNav" data-page="admin" class="hidden">
            <i>08</i>Kullanıcı Yönetimi
          </button>
        </nav>
        <div class="userbox">
          <label class="program-language"><span data-language-label>Program Dili</span><select id="programLanguage" onchange="changeProgramLanguage(this.value,true)"><option value="tr">Türkçe</option><option value="en">English</option><option value="fr">Français</option></select></label>
          <b id="who"></b><small id="role"></small
          ><button class="logout" onclick="logout()">Çıkış Yap</button>
        </div>
      </aside>
      <main class="content">
        <header class="top">
          <img class="mobile-app-logo" src="/rafex-logo.png" alt="Rafex" />
          <h1 id="pageTitle">Ana Sayfa</h1>
          <div class="top-actions">
            <button
              id="installAppButton"
              class="install-app hidden"
              type="button"
              onclick="installRafexApp()"
            >
              Uygulamayı Yükle</button
            ><button class="soft history-top" onclick="openHistory()">
              Proje Geçmişi
            </button>
          </div>
        </header>
        <div class="page" id="page"></div>
      </main>
      <nav class="mobile-tabs" id="mobileTabs" aria-label="Uygulama menüsü">
        <button data-mobile-page="home"><b>⌂</b><span>Ana Sayfa</span></button
        ><button data-mobile-page="ayak"><b>A</b><span>Ayak</span></button
        ><button data-mobile-page="drive"><b>D</b><span>Drive-In</span></button
        ><button data-mobile-page="mekik2"><b>M</b><span>Mekik</span></button
        ><button type="button" onclick="toggleMobileMenu()">
          <b>☰</b><span>Menü</span>
        </button>
      </nav>
      <div class="mobile-scrim" onclick="closeMobileMenu()"></div>
    </section>
    <div
      class="modal"
      id="historyModal"
      onclick="if(event.target===this)this.classList.remove('open')"
    >
      <div class="modal-card">
        <div class="modal-head">
          <h2>Proje Geçmişi</h2>
          <button class="x" onclick="historyModal.classList.remove('open')">
            ×
          </button>
        </div>
        <div class="history-filters" id="historyFilters">
          <label>Proje tipi<select id="historyType" onchange="renderHistoryProjects()"><option value="all">Tüm proje tipleri</option><option value="b2b">B2B</option><option value="mekik2">Mekik</option><option value="drive-in">Drive-In</option><option value="ayak">Ayak Hesaplama</option></select></label>
          <label>Sıralama<select id="historySort" onchange="renderHistoryProjects()"><option value="newest">En yeni kayıt</option><option value="type">Proje tipine göre</option><option value="name">Proje adına göre</option></select></label>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
    <script>
      let appLanguage = localStorage.getItem("rafexProgramLanguage") || "tr",
        me = null,
        setup = false,
        groups = [{ rows: 0, bays: 0 }],
        braces = [{ length: 0, units: 0 }],
        driveCalculated = false,
        shuttleFeet = [],
        shuttleGroups = [],
        shuttleBraces = [],
        shuttleCalculated = false,
        footCalculated = false,
        projects = [],
        adminUsers = [];
      const $ = (id) => document.getElementById(id),
        localeForLanguage = (language = appLanguage) => language === "en" ? "en-GB" : language === "fr" ? "fr-FR" : "tr-TR",
        fmt = (n) => new Intl.NumberFormat(localeForLanguage()).format(n),
        esc = (s) =>
          String(s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      async function req(url, opt = {}) {
        const r = await fetch(url, {
            headers: { "content-type": "application/json" },
            ...opt,
          }),
          type = r.headers.get("content-type") || "";
        let j;
        if (type.includes("application/json")) j = await r.json();
        else {
          await r.text();
          throw new Error(
            "Sunucu yanıtı alınamadı. Lütfen sayfayı yenileyip tekrar deneyin.",
          );
        }
        if (!r.ok) throw new Error(translatedUiText(j.error || "İşlem başarısız"));
        return j;
      }
      async function boot() {
        const b = await req("/api/bootstrap");
        setup = b.needsSetup;
        if (setup) {
          $("authTitle").textContent = "İlk Kurulum";
          $("authText").textContent =
            "İlk süper kullanıcı hesabını oluşturun. Bu ekran yalnızca bir kez görünür.";
          $("authButton").textContent = "Süper Kullanıcı Oluştur";
          $("setupFullNameField").classList.remove("hidden");
          $("loginFullName").required = true;
          $("loginPass").autocomplete = "new-password";
        }
        try {
          const x = await req("/api/me");
          enter(x.user);
        } catch {}
      }
      $("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        $("authMsg").textContent = "";
        try {
          const data = {
            fullName: $("loginFullName").value,
            username: $("loginUser").value,
            password: $("loginPass").value,
            defaultLanguage: appLanguage,
          };
          if (setup) {
            await req("/api/setup", {
              method: "POST",
              body: JSON.stringify(data),
            });
            setup = false;
            $("authTitle").textContent = "Giriş Yap";
            $("authText").textContent =
              "Süper kullanıcı oluşturuldu. Şimdi giriş yapın.";
            $("authButton").textContent = "Giriş Yap";
            $("setupFullNameField").classList.add("hidden");
            $("loginFullName").required = false;
            $("loginFullName").value = "";
            $("loginPass").value = "";
            return;
          }
          const x = await req("/api/login", {
            method: "POST",
            body: JSON.stringify(data),
          });
          enter(x.user);
        } catch (e) {
          $("authMsg").textContent = e.message;
        }
      };
      async function enter(user) {
        me = user;
        await changeProgramLanguage(user.default_language || appLanguage, false);
        $("auth").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("who").textContent = user.full_name || user.username;
        $("role").textContent =
          `${user.role === "super" ? "Süper Kullanıcı" : "Kullanıcı"} · ${user.username}`;
        if (user.role === "super") $("adminNav").classList.remove("hidden");
        else $("adminNav").remove();
        await loadProjects();
        showPage("home");
      }
      async function logout() {
        await req("/api/logout", { method: "POST", body: "{}" });
        location.reload();
      }
      $("nav").onclick = (e) => {
        const b = e.target.closest("button[data-page]");
        if (b) showPage(b.dataset.page);
      };
      let m2ActiveModule = "mekik2";
      const m2ModuleStates = Object.create(null);
      const m2TypeApi = () => m2ActiveModule === "b2b" ? "/api/b2b-types" : "/api/mekik2-types";
      let mrViewerInstance = null;
      function showPage(name) {
        if (name === "admin" && me.role !== "super") name = "home";
        if (name !== "mr") { try { window.RafexMRViewer?.destroy(); } catch {} mrViewerInstance = null; }
        $("page").oninput = null;
        $("page").onclick = null;
        $("page").classList.toggle("b2b-mode", name === "b2b");
        document
          .querySelectorAll("#nav button")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.page === name),
          );
        const titles = {
          home: "Ana Sayfa",
          drive: "Drive-In Hesaplama",
          b2b: "B2B",
          mr: "MR",
          mekik: "Mekik (Gizli)",
          mekik2: "Mekik",
          konsol: "Konsol Kollu",
          ayak: "Ayak Hesaplama",
          travers: "Travers Hesaplama",
          admin: "Kullanıcı Yönetimi",
        };
        $("pageTitle").textContent = titles[name];
        if (name === "home") renderHome();
        else if (name === "drive") renderDrive();
        else if (name === "mekik") showPage("mekik2");
        else if (name === "mekik2") { m2ActivateModule("mekik2"); renderMekik2(); }
        else if (name === "b2b") { m2ActivateModule("b2b"); renderB2B(); }
        else if (name === "mr") { m2ActivateModule("mr"); renderMR(); }
        else if (name === "ayak") renderFoot();
        else if (name === "admin" && me.role === "super") renderAdmin();
        else
          $("page").innerHTML =
            `<div class="soon"><div class="soon-card"><span class="num">${esc(titles[name].slice(0, 2).toUpperCase())}</span><h2>${esc(titles[name])}</h2><p>Bu hesaplama modülü portal yapısına eklendi. Teknik formüller tanımlandığında aktif hesaplama ekranına dönüştürülecek.</p></div></div>`;
      }
      function mrUpdateSummary(){const modules=Math.max(1,Number($("mrModuleCount")?.value)||1),width=Math.max(300,Number($("mrSectionWidth")?.value)||2400),depth=Math.max(300,Number($("mrDepth")?.value)||800),levels=Math.max(1,Number($("mrLevels")?.value)||4);if($("mrTotalWidth"))$("mrTotalWidth").textContent=`${fmt(modules*width)} mm`;if($("mrFootprint"))$("mrFootprint").textContent=`${fmt(modules*width)} × ${fmt(depth)} mm`;if($("mrLevelSummary"))$("mrLevelSummary").textContent=`${levels} kat · ${modules} modül`;}
      function mrSetModel(key){document.querySelectorAll(".mr-part[data-mr-model]").forEach((button)=>button.classList.toggle("active",button.dataset.mrModel===key));if($("mrViewerStatus"))$("mrViewerStatus").textContent="Model yükleniyor…";mrViewerInstance?.setModel?.(key);}
      function mrSetView(view){document.querySelectorAll(".mr-view-toolbar [data-mr-view]").forEach((button)=>button.classList.toggle("active",button.dataset.mrView===view));mrViewerInstance?.setView?.(view);}
      function mrMountViewer(){const canvas=$("mrCanvas");if(!canvas)return;if(!window.RafexMRViewer?.mount){if($("mrViewerStatus"))$("mrViewerStatus").textContent="MR 3D motoru hazırlanıyor…";window.addEventListener("rafex-mr-viewer-ready",()=>{if($("mrCanvas"))mrMountViewer();},{once:true});return;}try{mrViewerInstance=window.RafexMRViewer.mount(canvas,{model:"module"});canvas.addEventListener("mr-viewer-loading",(event)=>{if($("mrViewerStatus"))$("mrViewerStatus").textContent=`${event.detail?.label||"MR modeli"} yükleniyor…`;});canvas.addEventListener("mr-viewer-model",(event)=>{if($("mrViewerStatus"))$("mrViewerStatus").textContent=`${event.detail?.label||"MR modeli"} · hazır`;});canvas.addEventListener("mr-viewer-error",(event)=>{if($("mrViewerStatus"))$("mrViewerStatus").textContent=event.detail?.message||"MR modeli yüklenemedi.";});}catch(error){if($("mrViewerStatus"))$("mrViewerStatus").textContent=error?.message||"MR 3D alanı açılamadı.";}}

      function weatherInfo(code) {
        if (code === 0) return ["Açık", "☀️"];
        if (code === 1 || code === 2) return ["Parçalı bulutlu", "⛅"];
        if (code === 3) return ["Kapalı", "☁️"];
        if (code === 45 || code === 48) return ["Sisli", "🌫️"];
        if (code >= 51 && code <= 67) return ["Yağmurlu", "🌧️"];
        if (code >= 71 && code <= 77) return ["Karlı", "🌨️"];
        if (code >= 80 && code <= 82) return ["Sağanak", "🌦️"];
        if (code >= 95) return ["Gök gürültülü", "⛈️"];
        return ["Değişken", "🌤️"];
      }

      function shuttleData() {
        const v = (id) => Math.max(0, +$(id).value || 0),
          depth = v("sdepth"),
          levels = v("slevels"),
          extra = v("sextra"),
          tr = shuttleGroups.reduce((s, g) => s + g.rows, 0),
          tb = shuttleGroups.reduce((s, g) => s + g.bays, 0),
          footUnits = shuttleFeet.reduce((s, f) => s + f.units, 0),
          p = depth * tb * levels,
          rail = tb * 2 * levels;
        return {
          tr,
          tb,
          p,
          items: [
            ...shuttleFeet.map((f, i) => [
              `${i + 1}. ayak — ${fmt(f.depth)} mm`,
              tr * f.units,
            ]),
            ["Ekstra profil sayısı", extra],
            [
              "Travers sayısı",
              Math.max(0, (footUnits * 2 + extra - 1) * tb * levels),
            ],
            ["Ray sayısı", rail],
            ["Palet yastığı sayısı", rail],
            ["Arka stoper sayısı", rail],
            ["Forklift stoper sayısı", tr],
            ["Giriş konsol sayısı", tr * levels],
            ["Yatay çapraz seti sayısı", tb * Math.floor(levels / 2)],
            ...shuttleBraces.map((b, i) => [
              `${i + 1}. düz arabağ — ${fmt(b.length)} mm`,
              b.units * tr * Math.ceil(levels / 2),
            ]),
          ],
          inputs: {
            depth,
            levels,
            extra,
            legs: footUnits,
            groups: shuttleGroups,
            braces: shuttleBraces,
            feet: shuttleFeet,
          },
        };

      const renderFootBase = renderFoot;
      renderFoot = function () {
        renderFootBase();
        $("footMsg").closest(".calc-grid").insertAdjacentHTML(
          "afterend",
          `<figure class="foot-diagram"><img src="${footDiagramImage}" width="503" height="208" alt="Ayak çerçevesinde Ly ve raf görünüşünde Lx ölçülerini gösteren temsili şema" decoding="async"><figcaption>TEMSİLİ AYAK ÇERÇEVESİ VE İLK KAT ÖLÇÜ ŞEMASI · Ly / Lx</figcaption></figure>`,
        );
      };
      function resetFootResult() {
        return () => {
          if (!footCalculated) return;
          footCalculated = false;
          $("fcap").textContent = "—";
          $("footMeta").textContent = "Bekleniyor";
          $("footResult").className = "empty";
          $("footResult").innerHTML =
            "<div><b>Hesaplama bekleniyor</b><p>Değişiklik yaptınız. Yeni sonuç için Hesapla butonuna basın.</p></div>";
        };
      }
      function getFootData() {
        const requestedHeight = Math.max(0, +$("fheight").value || 0),
          load = Math.max(0, +$("fload").value || 0),
          heightIndex = footHeights.findIndex((h) => h >= requestedHeight);
        if (!requestedHeight || !load)
          throw new Error("İlk kat yüksekliği ve ayak takımı yükü zorunlu.");
        if (heightIndex < 0)
          throw new Error(
            "Tabloda 3.000 mm üzeri ilk kat yüksekliği bulunmuyor.",
          );
        const tableHeight = footHeights[heightIndex],
          extraDiagonalCounts = [0, 1, 1, 2, 2, 3, 3, 4, 4, 4],
          extraDiagonalCount = extraDiagonalCounts[heightIndex],
          extraDiagonalWeight = extraDiagonalCount * 1.6,
          systems = footTables.map((table) => {
            const { recommendations } = footSelectRecommendedProfiles(
                table,
                heightIndex,
                load,
              ),
              [first, second] = recommendations,
              options = [first, second].map((p) =>
                p
                  ? {
                      thickness: p.thickness,
                      profile: p.name,
                      unitWeight: p.weight,
                      capacity: p.c[heightIndex],
                      margin: p.c[heightIndex] - load,
                    }
                  : null,
              ),
              best = options[0] || null;
            return { ly: table.ly, options, best };
          });
        return {
          p: load,
          inputs: { firstLevelHeight: requestedHeight, load },
          tableHeight,
          extraDiagonalCount,
          extraDiagonalWeight,
          systems,
        };
      }
      function footOptionHtml(option, index) {
        if (!option)
          return `<div class="foot-option"><span>${index + 1}. SONUÇ</span><div><b class="fail">Uygun profil yok</b><small>Yükü karşılayan başka profil bulunamadı</small></div><b>—</b><b>—</b></div>`;
        const note = index === 0 ? "ÖNERİLEN PROFİL" : "ALTERNATİF UYGUN PROFİL";
        return `<div class="foot-option ${index === 0 ? "recommended" : ""}"><span>${index + 1}. SONUÇ</span><div><b>${esc(option.profile)}</b><small>${note}</small></div><b class="ok">${fmt(option.capacity)} kg</b><b>${option.unitWeight.toLocaleString("tr-TR", { minimumFractionDigits: 2 })} kg/m</b></div>`;
      }
      function extraDiagonalData(x) {
        if (Number.isFinite(Number(x.extraDiagonalCount)))
          return {
            count: Number(x.extraDiagonalCount),
            weight: Number(x.extraDiagonalWeight),
          };
        const i = footHeights.indexOf(Number(x.tableHeight)),
          counts = [0, 1, 1, 2, 2, 3, 3, 4, 4, 4],
          count = i >= 0 ? counts[i] : 0;
        return { count, weight: count * 1.6 };
      }
      function footResultHtml(x) {
        const diagonal = extraDiagonalData(x);
        return `<div class="summary"><div><small>GİRİLEN YÜKSEKLİK</small><b>${fmt(x.inputs.firstLevelHeight)} mm</b></div><div><small>TABLO YÜKSEKLİĞİ</small><b>${fmt(x.tableHeight)} mm</b></div><div><small>YÜK</small><b>${fmt(x.p)} kg</b></div></div>${x.systems.map((s) => `<div class="foot-system"><div class="foot-system-head"><b>Ly ${fmt(s.ly)} mm</b><small>${s.best ? "2 uygun öneri" : "Uygun profil bulunamadı"}</small></div>${footOptionHtml(s.options[0], 0)}${footOptionHtml(s.options[1], 1)}${Number(s.ly) === 600 ? `<div class="foot-option extra-diagonal"><span>EKSTRA</span><div><b>Ekstra diagonal ağırlığı</b><small>${fmt(diagonal.count)} adet × 1,6 kg</small></div><b>${fmt(diagonal.count)} adet</b><b>${diagonal.weight.toLocaleString("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} kg</b></div>` : ""}</div>`).join("")}<div class="foot-note">Kapasiteler yalnızca düşey statik yük içindir. Sismik yük etkileri proje özelindeki statik analizde ayrıca kontrol edilmelidir.</div>`;
      }
      async function calculateFoot() {
        const name = $("fpn").value.trim();
        $("footMsg").textContent = "";
        if (!name) {
          $("footMsg").textContent = "Proje adı zorunlu.";
          return;
        }
        try {
          const x = getFootData(),
            saved = await req("/api/projects", {
              method: "POST",
              body: JSON.stringify({
                projectName: name,
                module: "ayak",
                payload: x,
              }),
            });
          $("fcap").textContent = `${fmt(x.p)} kg`;
          $("footMeta").textContent =
            `Kayıt ${String(saved.serialNo).padStart(4, "0")}`;
          $("footResult").className = "";
          $("footResult").innerHTML = footResultHtml(x);
          footCalculated = true;
          await loadProjects();
        } catch (e) {
          $("footMsg").textContent = e.message;
        }
      }
      async function loadProjects() {
        projects = (await req("/api/projects")).projects;
      }
      function historyModuleName(module) {
        return module === "b2b"
          ? "B2B"
          : module === "mekik2"
          ? "MEKİK"
          : module === "mekik"
          ? "MEKİK (GİZLİ)"
          : module === "drive-in"
            ? "DRIVE-IN"
            : module === "ayak"
              ? "AYAK HESAPLAMA"
              : String(module || "").toUpperCase();
      }
      function historyProjectBody(p, x, inp) {
