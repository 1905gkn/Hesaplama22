<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#173c2d" />
    <meta name="application-name" content="Rafex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Rafex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon-192.png" sizes="192x192" />

    <title>Rafex Configurator</title>
    <style>
      :root {
        --g: #214f3b;
        --g2: #173c2d;
        --y: #f2c500;
        --bg: #f2f4f1;
        --line: #dfe5e0;
        --ink: #17201b;
        --muted: #68736c;
        --red: #b43a3a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px Arial,
          sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 9px;
        padding: 11px 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
      .auth {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
      }
      .auth-brand {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 8vw;
        background: var(--g);
        color: #fff;
      }
      .auth-brand .brand-logo-auth {
        display: block;
        width: min(440px, 86%);
        height: auto;
        padding: 18px;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 20px 54px #07150e35;
      }
      .auth-brand .portal-name {
        margin: 26px 0 18px;
        color: #d8e2dc;
        font-size: clamp(34px, 4.5vw, 62px);
        line-height: 1;
        letter-spacing: -0.045em;
        font-weight: 400;
      }
      .auth-brand p {
        color: #c4d0c8;
        max-width: 520px;
        line-height: 1.7;
      }
      .auth-side {
        display: grid;
        place-items: center;
        padding: 30px;
      }
      .auth-card {
        width: min(410px, 100%);
        background: #fff;
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 20px 60px #17201b16;
      }
      .auth-card h2 {
        margin: 0 0 8px;
        font-size: 25px;
      }
      .auth-card > p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 24px;
      }
      .field {
        display: block;
        margin-top: 14px;
        color: #536058;
        font-size: 11px;
        font-weight: 700;
      }
      .field input {
        width: 100%;
        margin-top: 6px;
        padding: 12px;
        border: 1px solid #d8dfda;
        border-radius: 9px;
        outline: 0;
      }
      .language-field {
        display: grid;
        gap: 6px;
        margin: 0 0 18px;
        color: #536058;
        font-size: 11px;
        font-weight: 800;
      }
      .language-field select,
      .user-language-select {
        width: 100%;
        padding: 10px 11px;
        border: 1px solid #d8dfda;
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }
      .program-language {
        display: grid;
        gap: 5px;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #ffffff1c;
        color: #c6d2ca;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .06em;
      }
      .program-language select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ffffff26;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font: 700 11px Arial, sans-serif;
      }
      .field input:focus {
        border-color: #b89b00;
        box-shadow: 0 0 0 3px #f2c50033;
      }
      .primary {
        width: 100%;
        margin-top: 20px;
        background: var(--g);
        color: #fff;
      }
      .msg {
        min-height: 18px;
        margin-top: 13px;
        color: var(--red);
        font-size: 11px;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 240px 1fr;
      }
      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 20px 14px;
        background: var(--g2);
        color: #fff;
      }
      .side-brand {
        display: flex;
        align-items: center;
        padding: 5px 6px 18px;
        border-bottom: 1px solid #ffffff22;
      }
      .side-logo {
        display: block;
        width: 184px;
        max-width: 100%;
        height: auto;
        padding: 6px 9px;
        background: #fff;
        border-radius: 9px;
      }
      .nav {
        margin-top: 18px;
      }
      .nav button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0;
        padding: 11px 12px;
        background: transparent;
        color: #bcc9c0;
        text-align: left;
      }
      .nav button.active {
        background: #ffffff14;
        color: #fff;
      }
      .nav i {
        width: 24px;
        color: var(--y);
        font-style: normal;
      }
      .userbox {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 16px;
        padding: 12px;
        background: #ffffff0d;
        border-radius: 10px;
      }
      .userbox small {
        display: block;
        color: #99aa9f;
      }
      .logout {
        width: 100%;
        margin-top: 9px;
        padding: 8px;
        background: #ffffff12;
        color: #fff;
      }
      .content {
        min-width: 0;
      }
      .top {
        height: 72px;
        padding: 0 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .top h1 {
        font-size: 20px;
        margin: 0;
      }
      .top-actions {
        display: flex;
        gap: 8px;
      }
      .soft {
        background: #edf2ee;
        color: var(--g);
      }
      .page {
        padding: 26px 30px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding: 28px;
        background: var(--g);
        color: #fff;
        border-radius: 16px;
      }
      .hero p {
        margin: 0 0 9px;
        color: var(--y);
        font-size: 10px;
        letter-spacing: 0.18em;
        font-weight: 800;
      }
      .hero h2 {
        margin: 0;
        font-size: 32px;
      }
      .capacity {
        padding: 13px 18px;
        border-left: 3px solid var(--y);
        background: #0002;
      }
      .capacity small {
        display: block;
        color: #b8c8be;
      }
      .capacity b {
        font-size: 28px;
      }
      .calc-grid {
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        gap: 18px;
        margin-top: 18px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
      }
      .card-title {
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }
      .card-title h3 {
        margin: 0;
      }
      .card-title span {
        color: var(--muted);
        font-size: 10px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .input-field {
        display: block;
        margin-top: 15px;
        color: #536058;
        font-size: 10px;
        font-weight: 700;
      }
      .input-field input {
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        border: 1px solid #e5d991;
        background: #fff8d5;
        border-radius: 8px;
        font-weight: 800;
      }
      .sub {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 23px 0 9px;
      }
      .sub h4 {
        margin: 0;
      }
      .sub span {
        color: var(--muted);
        font-size: 10px;
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .dynrow {
        display: grid;
        grid-template-columns: 28px 1fr 1fr 30px;
        gap: 7px;
        align-items: end;
        padding: 9px;
        background: #f5f7f5;
        border-radius: 9px;
      }
      .dynrow > b {
        align-self: center;
        color: #9aa39d;
      }
      .dynrow .input-field {
        margin: 0;
      }
      .dynrow .input-field input {
        margin-top: 4px;
        padding: 7px;
      }
      .x {
        height: 31px;
        padding: 0;
        background: #e6eae7;
      }
      .add {
        width: 100%;
        margin-top: 8px;
        background: #edf2ee;
        color: var(--g);
        border: 1px dashed #b9c8bd;
      }
      .calc {
        width: 100%;
        margin-top: 20px;
        background: var(--y);
        color: var(--ink);
        padding: 14px;
      }
      .empty {
        min-height: 400px;
        display: grid;
        place-items: center;
        text-align: center;
        color: #849087;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin: 16px 0;
        background: var(--g);
        color: #fff;
        border-radius: 9px;
        overflow: hidden;
      }
      .summary div {
        padding: 13px;
      }
      .summary small {
        display: block;
        color: #b8c8be;
        font-size: 8px;
      }
      .summary b {
        font-size: 21px;
      }
      .table {
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .trow {
        display: grid;
        grid-template-columns: 1fr 90px;
        padding: 9px 12px;
        border-top: 1px solid #edf0ed;
      }
      .trow:first-child {
        border: 0;
        background: #eef1ee;
        font-size: 9px;
        font-weight: 800;
      }
      .trow b {
        text-align: right;
      }
      .foot-note {
        margin: 15px 0 0;
        padding: 12px;
        background: #fff8d5;
        border-left: 3px solid var(--y);
        color: #625600;
        font-size: 11px;
        line-height: 1.5;
      }
      .foot-system {
        margin-top: 13px;
        border: 1px solid var(--line);
        border-radius: 11px;
        overflow: hidden;
      }
      .foot-system-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        background: var(--g);
        color: #fff;
      }
      .foot-system-head small {
        color: #bfd0c5;
      }
      .foot-option {
        display: grid;
        grid-template-columns: 78px 1fr 86px 90px;
        gap: 8px;
        align-items: center;
        padding: 11px 12px;
        border-top: 1px solid var(--line);
      }
      .foot-option:first-of-type {
        border-top: 0;
      }
      .foot-option.recommended {
        background: #fff8d5;
      }
      .foot-option > span:first-child {
        font-weight: 800;
      }
      .foot-option small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        margin-top: 3px;
      }
      .foot-option b {
        text-align: right;
      }
      .foot-option .ok {
        color: #2f6942;
      }
      .foot-option .fail {
        color: var(--red);
      }
      .soon {
        min-height: 65vh;
        display: grid;
        place-items: center;
      }
      .soon-card {
        text-align: center;
        max-width: 520px;
        padding: 50px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .soon-card .num {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        margin: auto;
        background: var(--y);
        border-radius: 15px;
        font-size: 24px;
        font-weight: 900;
      }
      .soon-card h2 {
        font-size: 28px;
      }
      .admin-grid {
        display: grid;
        grid-template-columns: 330px 1fr;
        gap: 18px;
      }
      .users {
        width: 100%;
        border-collapse: collapse;
      }
      .users th,
      .users td {
        padding: 11px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .badge {
        padding: 4px 7px;
        border-radius: 20px;
        background: #e7f2e9;
        color: #2f6942;
        font-size: 9px;
      }
      .badge.off {
        background: #f5e7e7;
        color: #a23838;
      }
      .small-btn {
        padding: 7px 9px;
        background: #edf2ee;
        color: var(--g);
        font-size: 10px;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        background: #10211999;
        padding: 4vh 4vw;
      }
      .modal.open {
        display: grid;
        place-items: center;
      }
      .modal-card {
        width: min(900px, 100%);
        max-height: 92vh;
        overflow: auto;
        background: #fff;
        border-radius: 16px;
      }
      .modal-head {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 17px 20px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .modal-head h2 {
        margin: 0;
      }
      .history-list {
        padding: 15px;
      }
      .history-filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 14px 15px 0;
      }
      .history-filters[hidden] { display: none; }
      .history-filters label { color: var(--muted); font-size: 9px; font-weight: 900; text-transform: uppercase; }
      .history-filters select { width: 100%; min-height: 40px; margin-top: 5px; padding: 8px 32px 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #f8faf8; color: var(--ink); font-weight: 800; }
      .history-item {
        margin-bottom: 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .history-summary {
        width: 100%;
        display: grid;
        grid-template-columns: 80px 1fr 130px 100px;
        gap: 12px;
        align-items: center;
        padding: 13px;
        background: #f8faf8;
        text-align: left;
      }
      .history-summary small {
        display: block;
        color: var(--muted);
      }
      .history-detail {
        display: none;
        padding: 14px;
        background: #fff;
        border-top: 1px solid var(--line);
      }
      .history-item.open .history-detail {
        display: block;
      }
      .history-inputs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .history-inputs div {
        padding: 10px;
        background: #f4f6f4;
        border-radius: 8px;
      }
      .history-inputs small {
        display: block;
        color: var(--muted);
        font-size: 8px;
      }
      .history-inputs b {
        display: block;
        margin-top: 4px;
      }
      .history-groups {
        margin: 8px 0 13px;
        color: var(--muted);
        font-size: 10px;
      }
      @media (max-width: 720px) {
        .history-summary {
          grid-template-columns: 60px 1fr 80px;
        }
        .history-summary .history-user {
          display: none;
        }
        .history-inputs {
          grid-template-columns: 1fr 1fr;
        }
        .history-filters { grid-template-columns: 1fr; }
        .foot-option {
          grid-template-columns: 65px 1fr 75px;
        }
        .foot-option > b:last-child {
          display: none;
        }
      }
      @media (max-width: 1000px) {
        .calc-grid,
        .admin-grid {
          grid-template-columns: 1fr;
        }
        .auth {
          grid-template-columns: 1fr;
        }
        .auth-brand {
          display: none;
        }
      }
      @media (max-width: 720px) {
        .shell {
          grid-template-columns: 1fr;
        }
        .side {
          position: static;
          height: auto;
        }
        .nav {
          display: flex;
          overflow: auto;
        }
        .nav button {
          min-width: 140px;
        }
        .userbox {
          position: static;
          margin-top: 10px;
        }
        .top {
          padding: 0 15px;
        }
        .page {
          padding: 14px;
        }
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }
        .hero {
          display: block;
        }
        .capacity {
          margin-top: 18px;
        }
      }
    </style>
    <style>
      .foot-diagram {
        margin: 18px 0 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #f8faf8;
        text-align: center;
      }
      .foot-diagram img {
        display: block;
        width: 100%;
        height: auto;
        max-width: 1028px;
        margin: 0 auto;
        background: #fff;
        border-radius: 7px;
      }
      .foot-diagram figcaption {
        margin-top: 10px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .extra-diagonal {
        background: #eef5f0;
        border-top: 2px solid #cbdacf;
      }
      .extra-diagonal > span:first-child {
        color: var(--g);
      }
      .welcome-hero {
        padding: 32px;
        background: linear-gradient(135deg, var(--g), var(--g2));
        color: #fff;
        border-radius: 16px;
      }
      .welcome-hero p {
        margin: 0 0 10px;
        color: var(--y);
        font-size: 10px;
        letter-spacing: 0.18em;
        font-weight: 800;
      }
      .welcome-hero h2 {
        margin: 0;
        font-size: clamp(30px, 4vw, 48px);
      }
      .welcome-date {
        margin-top: 12px;
        color: #c4d0c8;
        text-transform: capitalize;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1.25fr repeat(3, 1fr);
        gap: 14px;
        margin-top: 18px;
      }
      .dashboard-card {
        min-height: 180px;
        padding: 20px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .dashboard-card small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.12em;
        font-weight: 800;
      }
      .dashboard-card .metric {
        display: block;
        margin-top: 18px;
        font-size: 30px;
      }
      .dashboard-card p {
        color: var(--muted);
        line-height: 1.5;
      }
      .weather-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .weather-icon {
        font-size: 38px;
      }
      .dashboard-meta {
        margin-top: 12px;
        color: var(--muted);
        font-size: 10px;
      }
      .dashboard-error {
        color: var(--red);
      }
      .admin-grid .card {
        overflow: auto;
      }
      @media (max-width: 1100px) {
        .dashboard-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .m2-layout {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr);
        align-items: stretch;
        gap: 18px;
        margin-top: 18px;
      }
      /* B2B, Mekik arayÃ¼z ve yerleÅŸim altyapÄ±sÄ±nÄ± kullanÄ±r; kayÄ±tlarÄ± ve
         koyu kÄ±rmÄ±zÄ± gÃ¶rsel kimliÄŸi kendi modÃ¼lÃ¼nde tutulur. */

        --g: #761b2a;
        --g2: #430c15;
        --red: #9f2438;
        --b2b-foot-color: #004f7c;
        --b2b-traverse-color: #e5be01;
        --b2b-foot-filter: sepia(1) saturate(8) hue-rotate(164deg) brightness(.63);

      #page.b2b-mode .hero {

      }

      #page.b2b-mode .m2-config-card { display:none; }
      #page.b2b-mode .m2-segment button.active,
      #page.b2b-mode .m2-form .classic-choice,
      #page.b2b-mode .m2-project-save,
      #page.b2b-mode .m2-floor-add,
      #page.b2b-mode .m2-pdf-button {
        border-color: #5b111d;
        background: linear-gradient(180deg, #8d2638, #681421);
      }
      #page.b2b-mode .m2-floor-editor,
      #page.b2b-mode .m2-report-panel,
      #page.b2b-mode .m2-saved-types-panel {
        box-shadow: 0 10px 30px #430c1518;
      }
      #page.b2b-mode .m2-floor-toolbar,
      #page.b2b-mode .m2-saved-types-head {
        border-color: #d7b8be;
      }
      #page.b2b-mode .m2-a4-brand-copy b,
      #page.b2b-mode .m2-report-head b,
      #page.b2b-mode .m2-floor-status strong {
