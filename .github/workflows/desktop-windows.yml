name: Rafex Desktop Windows Beta

on:
  push:
    branches:
      - rafex-desktop-beta
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Rafex Desktop
        working-directory: desktop
        run: npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Rafex-Configurator-Desktop-Windows-Beta
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/rafex-configurator-desktop.exe
          if-no-files-found: error
          retention-days: 14
