name: Verify Vercel Git deployment

on:
  push:
    branches:
      - rafex-configurator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel Git integration active
        run: |
          echo "Production deployment is handled directly by the Vercel Git integration for 1905gkn/Hesaplama22:rafex-configurator."
          echo "The old CLI workflow was removed because VERCEL_TOKEN was empty and caused false deployment failures."
