name: Deploy rafex-configurator to Vercel

on:
  push:
    branches:
      - rafex-configurator
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  VERCEL_ORG_ID: team_na0LSwDQ6yYTYeOdJgrjzUYj
  VERCEL_PROJECT_ID: prj_2BNBxHcbHo1JZreVUjUl1j59txmO
  APPROVED_DEPLOYMENT_ID: dpl_3DpLCzXrB8CikLXLMVfnva2m35Yo
  PRODUCTION_HOST: rafex-configurator.vercel.app

jobs:
  promote_exact:
    if: ${{ contains(github.event.head_commit.message, '[promote-exact-artifact]') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for native Vercel deploy, promote exact artifact, and verify
        shell: bash
        run: |
          set -euo pipefail

          set_status() {
            local state="$1"
            local description="$2"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$(node -e 'console.log(JSON.stringify({state:process.argv[1],context:"exact-production-artifact",description:process.argv[2]}))' "$state" "$description")" >/dev/null
          }

          fail() {
            set_status failure "Exact 34vnlp6h8 promotion failed"
          }
          trap fail ERR

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is empty." >&2
            exit 1
          fi

          set_status pending "Waiting for Vercel Git deploy to settle"

          settled=0
          for attempt in $(seq 1 30); do
            payload=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${PRODUCTION_HOST}?teamId=${VERCEL_ORG_ID}")
            current_sha=$(printf '%s' "$payload" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.meta?.githubCommitSha||"")})')
            current_state=$(printf '%s' "$payload" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.readyState||j.state||"")})')
            echo "settle attempt ${attempt}: sha=${current_sha} state=${current_state}"
            if [ "$current_sha" = "$GITHUB_SHA" ] && [ "$current_state" = "READY" ]; then
              settled=1
              break
            fi
            sleep 4
          done

          if [ "$settled" != "1" ]; then
            echo "Native Vercel deployment for ${GITHUB_SHA} did not settle in time." >&2
            exit 1
          fi

          set_status pending "Promoting exact 34vnlp6h8 artifact"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${APPROVED_DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}"
          echo

          verified=0
          for attempt in $(seq 1 30); do
            payload=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${PRODUCTION_HOST}?teamId=${VERCEL_ORG_ID}")
            current_id=$(printf '%s' "$payload" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).id||"")})')
            echo "verify attempt ${attempt}: production=${current_id}"
            if [ "$current_id" = "$APPROVED_DEPLOYMENT_ID" ]; then
              verified=1
              break
            fi
            sleep 4
          done

          if [ "$verified" != "1" ]; then
            echo "Production alias did not move to ${APPROVED_DEPLOYMENT_ID}." >&2
            exit 1
          fi

          trap - ERR
          set_status success "Exact 34vnlp6h8 artifact is live"
          echo "Exact approved deployment is live on ${PRODUCTION_HOST}."

  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[promote-exact-artifact]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel project settings
        run: npx vercel@58.1.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --scope=gokhankaya-4823s-projects

      - name: Apply B2B accessory fixes
        run: |
          sed -i "s/b2b-accessories-v2/b2b-accessories-v1/" client/b2b-accessories.js
          cp scripts/apply-b2b-accessory-fixes.js /tmp/apply-b2b-accessory-fixes.cjs
          node /tmp/apply-b2b-accessory-fixes.cjs
          cp scripts/apply-b2b-accessory-placement-v2.js /tmp/apply-b2b-accessory-placement-v2.cjs
          node /tmp/apply-b2b-accessory-placement-v2.cjs
          cp scripts/apply-b2b-accessory-fit-v3.js /tmp/apply-b2b-accessory-fit-v3.cjs
          node /tmp/apply-b2b-accessory-fit-v3.cjs
          cp scripts/apply-b2b-h-traverse-lower-v5.js /tmp/apply-b2b-h-traverse-lower-v5.cjs
          node /tmp/apply-b2b-h-traverse-lower-v5.cjs

      - name: Build production artifact
        run: npx vercel@58.1.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope=gokhankaya-4823s-projects

      - name: Inject and verify section locator in prebuilt function
        shell: bash
        run: |
          node scripts/inject-b2b-section-positioner.mjs
          output_worker=$(find .vercel/output/functions -type f -path '*/dist/server/index.js' -print -quit)
          if [ -z "$output_worker" ]; then
            echo "Vercel prebuilt server output was not found."
            find .vercel/output -maxdepth 6 -type f -print
            exit 1
          fi
          cp dist/server/index.js "$output_worker"
          cmp -s dist/server/index.js "$output_worker"
          echo "Kesit Yer Belirleme injected into $output_worker"

      - name: Remove Git metadata before deploy
        run: rm -rf .git

      - name: Deploy production artifact
        run: npx vercel@58.1.0 deploy --prebuilt --prod --force --token="${{ secrets.VERCEL_TOKEN }}" --scope=gokhankaya-4823s-projects
